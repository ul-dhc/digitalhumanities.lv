name: Deploy Digitalhumanities.lv

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sync Google Sheets and build Astro site
        uses: withastro/action@v6
        env:
          SITE_URL: https://digitalhumanities.lv
          BASE_PATH: /
        with:
          node-version: 22
          package-manager: pnpm@11.9.0

      - name: Check import and publication behaviour
        run: node --test scripts/*.test.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the published version
        env:
          SITE_URL: https://digitalhumanities.lv
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs
